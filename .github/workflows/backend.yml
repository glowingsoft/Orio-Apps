name: backend

# Push to `backend` → check, then deploy to the server. Pull requests to `backend` → check only.
# Manual run (Actions → backend → Run workflow): action "deploy" (default), "rollback", or
# "test-auto-rollback" (deploys with a simulated failed health check to prove the automatic
# rollback works — run it right after a successful deploy so the code does not change).
# Deploys go through AWS Systems Manager — no SSH, so port 22 can stay closed to the
# internet. One-time AWS / GitHub setup: deploy/ssm/README.md.
on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = check and deploy this branch; rollback = restore the previous release; test-auto-rollback = deploy with a simulated failure"
        type: choice
        options: [deploy, rollback, test-auto-rollback]
        default: deploy

permissions:
  contents: read
  id-token: write   # GitHub OIDC → short-lived AWS credentials (no AWS keys stored in GitHub)

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  HEALTH_URL: https://aazabex.com/api/health
  AWS_REGION: ${{ vars.AWS_REGION }}
  DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  FIREBASE_PARAM: /yazeen/prod/firebase-service-account

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Compile check only. The real test is the deploy's health check on EC2 against the
    # production database (only the EC2 IP is allowed in Atlas), with automatic rollback.
    # The temporary CI MongoDB + startup test below is disabled (the service container
    # never accepted connections on the GitHub runner).
    # services:
    #   mongo:
    #     image: mongo:8.0
    #     ports: ["27017:27017"]
    # env:
    #   MONGO_URL: mongodb://localhost:27017
    #   DB_NAME: orio_ci
    #   ACCESS_SECRET: ci-access-secret-0123456789abcdef0123
    #   REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012
    #   TEST_RECHARGE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile server.py admin_dashboard.py admin_phase1.py account_deletion.py moderation.py push.py
      # - name: Wait for CI MongoDB
      #   run: |
      #     python - <<'PY'
      #     import sys, time
      #     from pymongo import MongoClient
      #     for attempt in range(60):
      #         try:
      #             MongoClient("mongodb://localhost:27017", serverSelectionTimeoutMS=2000).admin.command("ping")
      #             print(f"CI MongoDB ready after {attempt * 2}s")
      #             sys.exit(0)
      #         except Exception as e:
      #             last = e
      #             time.sleep(2)
      #     print(f"CI MongoDB did not become ready: {last}")
      #     sys.exit(1)
      #     PY
      # - name: Backend starts and is healthy
      #   run: |
      #     uvicorn server:app --port 8001 > backend.log 2>&1 &
      #     for i in $(seq 1 60); do
      #       if curl -sf http://localhost:8001/api/health | grep -q '"db":true'; then curl -s http://localhost:8001/api/health; echo; exit 0; fi
      #       sleep 2
      #     done
      #     echo "Backend did not start"; cat backend.log; exit 1
      # - name: Backend log
      #   if: failure()
      #   run: tail -200 backend.log

  deploy:
    needs: check
    if: github.ref == 'refs/heads/backend' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action != 'rollback'))
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Package release
        # Never includes the server's .env, the Firebase key, the venv, tests or logs.
        run: |
          printf '%s\n%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ) run $GITHUB_RUN_ID" > backend/REVISION
          tar -czf backend-release.tgz -C backend \
            --exclude='./.env' --exclude='./service-account.json' --exclude='./venv' \
            --exclude='__pycache__' --exclude='./tests' --exclude='*.log' .
          ls -lh backend-release.tgz
      - name: Upload release to S3
        run: |
          echo "KEY=deploys/backend/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          aws s3 cp backend-release.tgz "s3://$DEPLOY_BUCKET/deploys/backend/$GITHUB_RUN_ID/backend-release.tgz"
          aws s3 cp deploy/ssm/backend_deploy.sh "s3://$DEPLOY_BUCKET/deploys/backend/$GITHUB_RUN_ID/backend_deploy.sh"
      - name: Store Firebase key in Parameter Store
        # Optional: without the secret, the key file already on the server is kept.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FB=-" >> "$GITHUB_ENV"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT not set — keeping the server's key file"; exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('type')=='service_account' and d.get('private_key')" \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT is not a valid service account JSON"; exit 1; }
          umask 077; printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/fb.json
          aws ssm put-parameter --name "$FIREBASE_PARAM" --type SecureString --overwrite --value file:///tmp/fb.json > /dev/null
          rm -f /tmp/fb.json
          echo "FB=$FIREBASE_PARAM" >> "$GITHUB_ENV"
      - name: Deploy on the server (rolls back automatically on failure)
        if: inputs.action != 'test-auto-rollback'
        run: |
          bash deploy/ssm/ssm-fetch-run.sh "$KEY" "backend-release.tgz backend_deploy.sh" \
            "bash ./backend_deploy.sh ./backend-release.tgz $FB" 1200
      - name: Automatic-rollback test (simulated failed health check)
        if: inputs.action == 'test-auto-rollback'
        # Passes only if the server's deploy script exited with code 1 (= "failed, rolled back,
        # previous release healthy") AND printed its marker. Code 0 means no rollback happened;
        # code 2 means the rollback itself was unhealthy.
        run: |
          set +e
          OUT=$(bash deploy/ssm/ssm-fetch-run.sh "$KEY" "backend-release.tgz backend_deploy.sh" \
            "SIMULATE_HEALTH_FAILURE=1 bash ./backend_deploy.sh ./backend-release.tgz $FB" 1200 2>&1)
          RC=$?
          echo "$OUT"
          if [ "$RC" -eq 1 ] && echo "$OUT" | grep -q "Rolled back and healthy"; then
            echo "::notice::Automatic rollback verified - the previous release was restored and is healthy"
          else
            echo "::error::Automatic rollback test failed (server exit code $RC)"; exit 1
          fi
      - name: Public health check
        run: curl -sf "$HEALTH_URL" && echo

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll back to the previous release
        run: |
          KEY="deploys/backend/rollback-$GITHUB_RUN_ID"
          aws s3 cp deploy/ssm/backend_rollback.sh "s3://$DEPLOY_BUCKET/$KEY/backend_rollback.sh"
          bash deploy/ssm/ssm-fetch-run.sh "$KEY" "backend_rollback.sh" "bash ./backend_rollback.sh" 600
      - name: Public health check
        run: curl -sf "$HEALTH_URL" && echo

