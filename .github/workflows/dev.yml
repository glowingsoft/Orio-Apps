
name: dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_DIR: /home/ubuntu/orio/backend
  VENV_DIR: /home/ubuntu/orio/venv
  SERVICE: orio
  HEALTH_URL: https://aazabex.com/api/health

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/dev.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/dev.yml'

  # ---------------------------------------------------------------- backend
  backend-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: orio_ci
      ACCESS_SECRET: ci-access-secret-0123456789abcdef0123
      REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012
      TEST_RECHARGE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile server.py admin_dashboard.py admin_phase1.py account_deletion.py moderation.py push.py
      - name: Backend starts and is healthy
        run: |
          uvicorn server:app --port 8001 > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8001/api/health | grep -q '"db":true'; then curl -s http://localhost:8001/api/health; echo; exit 0; fi
            sleep 2
          done
          echo "Backend did not start"; cat backend.log; exit 1
      - name: Backend log
        if: failure()
        run: tail -200 backend.log

  backend-deploy:
    needs: backend-check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust server host key
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Back up current code
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "rm -rf '$BACKEND_DIR.prev' && cp -a '$BACKEND_DIR' '$BACKEND_DIR.prev'"
      - name: Upload code
        # The server's .env, uploads and caches stay untouched.
        run: |
          rsync -az --exclude '.env' --exclude '__pycache__/' --exclude 'tests/' --exclude '*.log' \
            backend/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$BACKEND_DIR/"
      - name: Install, restart, health check (rolls back on failure)
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<EOF
          set -e
          rollback() {
            echo "Deploy failed — restoring previous code"
            rm -rf '$BACKEND_DIR' && mv '$BACKEND_DIR.prev' '$BACKEND_DIR'
            sudo systemctl restart '$SERVICE'
            exit 1
          }
          '$VENV_DIR/bin/pip' install -q -r '$BACKEND_DIR/requirements.txt' || rollback
          sudo systemctl restart '$SERVICE' || rollback
          for i in \$(seq 1 30); do
            if curl -sf '$HEALTH_URL' | grep -q '"db":true'; then curl -s '$HEALTH_URL'; echo; exit 0; fi
            sleep 2
          done
          sudo journalctl -u '$SERVICE' -n 50 --no-pager
          rollback
          EOF

  # --------------------------------------------------------------- frontend
  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Type check (report only — pre-existing errors)
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Android bundle compiles
        run: npx expo export --platform android --output-dir dist-ci
        env:
          EXPO_PUBLIC_BACKEND_URL: https://aazabex.com

  frontend-build:
    needs: frontend-check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Skip when EXPO_TOKEN is not set
        if: env.EXPO_TOKEN == ''
        working-directory: .
        run: echo "::notice::EXPO_TOKEN secret not set — skipping the EAS build."
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: yarn install --frozen-lockfile
      - name: Start Android preview build (APK)
        if: env.EXPO_TOKEN != ''
        # Runs on EAS; the APK download link appears on expo.dev under the project's builds.
        run: eas build --platform android --profile preview --non-interactive --no-wait
