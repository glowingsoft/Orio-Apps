name: frontend

# Push to `frontend` → check, publish the website, start an Android build (when EXPO_TOKEN
# is set). Pull requests → check only. Manual run: action "deploy" (default) or "rollback"
# (website only — app builds are rolled back by re-installing an older EAS build).
# The website is published through AWS Systems Manager (no SSH): deploy/ssm/README.md.
on:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = check and publish this branch; rollback = restore the previous website"
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read
  id-token: write   # GitHub OIDC → short-lived AWS credentials

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://aazabex.com/
  AWS_REGION: ${{ vars.AWS_REGION }}
  DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Write .env from the EXPO_ENV secret
        env:
          EXPO_ENV: ${{ secrets.EXPO_ENV }}
        run: |
          [ -n "$EXPO_ENV" ] || { echo "::error::EXPO_ENV secret is not set (repository secret with the frontend .env contents)"; exit 1; }
          printf '%s\n' "$EXPO_ENV" > .env
      - name: Lint (report only — pre-existing errors)
        continue-on-error: true
        run: yarn lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Android bundle compiles
        run: npx expo export --platform android --output-dir dist-ci

  web-deploy:
    needs: check
    if: github.ref == 'refs/heads/frontend' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Write .env from the EXPO_ENV secret
        working-directory: frontend
        env:
          EXPO_ENV: ${{ secrets.EXPO_ENV }}
        run: |
          [ -n "$EXPO_ENV" ] || { echo "::error::EXPO_ENV secret is not set"; exit 1; }
          printf '%s\n' "$EXPO_ENV" > .env
      - name: Build web
        working-directory: frontend
        run: |
          npx expo export --platform web --output-dir dist-web --clear
          printf '%s\n%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ) run $GITHUB_RUN_ID" > dist-web/REVISION
          tar -czf ../site-release.tgz -C dist-web .
          ls -lh ../site-release.tgz
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload build to S3
        run: |
          echo "KEY=deploys/web/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          aws s3 cp site-release.tgz "s3://$DEPLOY_BUCKET/deploys/web/$GITHUB_RUN_ID/site-release.tgz"
          aws s3 cp deploy/ssm/web_deploy.sh "s3://$DEPLOY_BUCKET/deploys/web/$GITHUB_RUN_ID/web_deploy.sh"
      - name: Publish on the server (restores the previous site on failure)
        run: bash deploy/ssm/ssm-fetch-run.sh "$KEY" "site-release.tgz web_deploy.sh" "bash ./web_deploy.sh ./site-release.tgz" 600
      - name: Public site check
        run: curl -sf "$SITE_URL" | grep -qi '<script' && echo "Site OK"

  web-rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Restore the previous website
        run: |
          KEY="deploys/web/rollback-$GITHUB_RUN_ID"
          aws s3 cp deploy/ssm/web_rollback.sh "s3://$DEPLOY_BUCKET/$KEY/web_rollback.sh"
          bash deploy/ssm/ssm-fetch-run.sh "$KEY" "web_rollback.sh" "bash ./web_rollback.sh" 300

  apk-build:
    needs: check
    if: github.ref == 'refs/heads/frontend' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Skip when EXPO_TOKEN is not set
        if: env.EXPO_TOKEN == ''
        working-directory: .
        run: echo "::notice::EXPO_TOKEN secret not set — skipping the EAS build."
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: yarn install --frozen-lockfile
      - name: Start Android preview build (APK)
        if: env.EXPO_TOKEN != ''
        # Runs on EAS with the `preview` profile (values from the EAS "preview" environment).
        # The APK link appears on expo.dev → aazabex → yazeen → Builds.
        run: eas build --platform android --profile preview --non-interactive --no-wait

